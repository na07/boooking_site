<!doctype html>
<html lang="en">
  <head style="background-color: #a249a4" >
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title%} {% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body style="background-color: #c8bfe7">
          <nav class="navbar navbar-expand-lg" style="background-color: #a249a4;">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">home page</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="http://127.0.0.1:8000/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://127.0.0.1:8000/check_locations/">search</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
      <div class="container">
      <h2 style="text-align: center">Чек всех локаций</h2>
      <form method="get">
          <h2 style="text-align: center;">start</h2>
        <input type="date" class="form-control" name="start_date">
          <h2 style="text-align: center;">end</h2>
        <input type="date" class="form-control" name="end_date">
          <h2 style="text-align: center;">Опубликовать</h2>
        <div style="text-align: center;">
          <button class="btn btn-secondary">wait</button>
        </div>

      </form>
        <h2 style="display: flex; justify-content: center;">Список локаций</h2>
        <div style="text-align: center;">
        {% for location in locations %}
        {{ location.title }}{% if not forloop.last %}, {% endif %}
        {% endfor %}
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY"
  </body>
